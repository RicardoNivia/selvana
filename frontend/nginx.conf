server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: las rutas del cliente caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
